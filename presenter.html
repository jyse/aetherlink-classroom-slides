<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06111e"><title>Presenter view · Aetherlink classroom</title>
<link rel="stylesheet" href="styles.css?v=58">
<style>
  body{padding:1.4rem clamp(1rem,3vw,2.2rem);gap:1.2rem;min-height:100vh}
  .p-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:1rem}
  .p-brand{font-weight:750;letter-spacing:.1em;font-size:.95rem}
  .p-brand span{color:var(--cyan)}
  .p-clock{display:flex;gap:1.4rem;align-items:center;font-variant-numeric:tabular-nums}
  .p-clock .label{display:block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .p-elapsed{font-size:1.6rem;font-weight:700;color:var(--text)}
  .p-status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
  .p-status .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
  .p-status.live .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
  .p-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:1.4rem;margin-top:1.2rem;flex:1}
  .p-main{min-width:0}
  .p-kicker{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 .4rem;display:flex;gap:.6rem;align-items:center}
  .p-type{padding:.25rem .6rem;border-radius:999px;font-weight:750;color:var(--ink);background:var(--context)}
  [data-ptype=concept] .p-type{background:var(--concept)}
  [data-ptype=practice] .p-type{background:var(--practice)}
  [data-ptype=review] .p-type{background:var(--review)}
  [data-ptype=recap] .p-type{background:var(--recap)}
  [data-ptype=pause] .p-type{background:var(--pause);color:#fff}
  [data-ptype=context] .p-type{background:var(--context);color:#fff}
  .p-title{font-size:clamp(1.5rem,3vw,2.3rem);margin:0 0 1rem;line-height:1.1}
  .p-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1rem}
  .p-block h2{margin:0 0 .6rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .p-block.notes{border-left:4px solid var(--cyan)}
  .p-block.prompt{border-left:4px solid var(--violet)}
  .p-block p{margin:0;white-space:pre-wrap;line-height:1.6;font-size:1.05rem}
  .p-side{display:flex;flex-direction:column;gap:1rem}
  .p-next{background:var(--surface2);border:1px dashed var(--border);border-radius:12px;padding:1rem 1.2rem}
  .p-next h2{margin:0 0 .3rem;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .p-next strong{font-size:1.05rem;display:block}
  .p-timer{background:var(--surface);border:3px solid var(--amber);border-radius:14px;padding:1rem;text-align:center}
  .p-timer .face{font-size:2.6rem;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums}
  .p-timer.late .face{color:#ff5a5a}
  .p-timer .ctrl{display:flex;gap:.5rem;justify-content:center;margin-top:.6rem}
  .p-timer button{min-height:36px;padding:.4rem .8rem;font-size:.8rem}
  .p-empty{color:var(--muted);font-style:italic}
  .p-nav{display:flex;gap:.5rem;margin-top:.8rem}
  .p-progress{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
  <div class="p-top">
    <div class="p-brand">AETHER<span>LINK</span> · Presenter view</div>
    <div class="p-clock">
      <div><span class="label">Elapsed</span><span id="elapsed" class="p-elapsed">00:00</span></div>
      <div class="p-status" id="sync-status"><span class="dot"></span><span id="sync-label">Waiting for the main window…</span></div>
    </div>
  </div>
  <div class="p-grid">
    <div class="p-main" id="ptype-wrap">
      <p class="p-kicker"><span class="p-type" id="p-type-label">Context</span><span id="p-kicker-text"></span><span class="p-progress" id="p-progress"></span></p>
      <h1 class="p-title" id="p-title">Waiting for the presentation…</h1>
      <div class="p-block notes">
        <h2>Facilitator notes</h2>
        <p id="p-notes" class="p-empty">Open the main deck and navigate a slide to see its notes here.</p>
      </div>
      <div class="p-block prompt" id="p-prompt-block" hidden>
        <h2>Say / paste this</h2>
        <p id="p-prompt"></p>
      </div>
    </div>
    <div class="p-side">
      <div class="p-next">
        <h2>Next slide</h2>
        <strong id="p-next-title">—</strong>
      </div>
      <div class="p-timer" id="p-timer" hidden>
        <div class="label" style="font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">This assignment</div>
        <div class="face" id="p-timer-face">00:00</div>
        <div class="ctrl">
          <button id="p-timer-start">Start</button>
          <button id="p-timer-reset" class="secondary">Reset</button>
        </div>
      </div>
    </div>
  </div>
  <script src="slides.js?v=58" defer></script>
  <script src="presenter.js?v=58" defer></script>
</body></html>

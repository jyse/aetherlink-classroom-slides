name: Anatomy figure acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['assets/anatomy/**', 'tools/anatomy/**', 'app.js', 'styles.css', 'workshop5*.html', 'workshop5-slides.js', '.github/workflows/anatomy-figures.yml']
permissions:
  contents: read
concurrency:
  group: anatomy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build standalone figures
        run: |
          node tools/anatomy/build.mjs --audit
          git diff --exit-code -- assets/anatomy
      - name: Test figure models
        run: |
          node --test --test-concurrency=2 tools/anatomy/bottleneck/model.test.mjs tools/anatomy/integration.test.mjs
      - name: Install remote browser checks
        id: browser-install
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check textures in both themes
        run: |
          mkdir -p anatomy-evidence
          export CHROME_PATH="$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          failures=0
          for id in bottleneck loop mcp hooks subagents eval; do
            for theme in '' '-light'; do
              node tools/anatomy/vendor/scripts/lines.mjs "assets/anatomy/$id$theme.html" --out "anatomy-evidence/$id$theme-lines.png" || failures=1
            done
          done
          test "$failures" = 0
      - name: Check classroom, presenter, mobile, controls and reduced motion
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/anatomy-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {mkdirSync} from 'node:fs';
          mkdirSync('anatomy-evidence',{recursive:true});
          const browser=await chromium.launch();
          const errors=[];
          const motionState=()=>({readouts:[...document.querySelectorAll('[data-readout]')].map(el=>el.textContent),parts:[...document.querySelectorAll('svg [transform],svg [style]')].map(el=>[el.getAttribute('transform'),el.getAttribute('style')])});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            page.on('pageerror',error=>errors.push(error.message));
            await page.context().addInitScript(()=>{
              window.__anatomyErrors=[];
              addEventListener('error',e=>window.__anatomyErrors.push(e.message));
              addEventListener('unhandledrejection',e=>window.__anatomyErrors.push(String(e.reason)));
            });
            for(const slide of [8,10,30,35,39,43,44]){
              await page.goto(`http://127.0.0.1:8765/workshop5.html#${slide}`);
              const iframe=page.locator('.anatomy-figure iframe');
              await iframe.waitFor(); assert.ok(await iframe.getAttribute('title'));
              const frame=await iframe.elementHandle().then(el=>el.contentFrame());
              await frame.locator('svg').first().waitFor();
              assert.deepEqual(await frame.evaluate(()=>window.__anatomyErrors),[]);
              const controls=frame.locator('button,input,select,[role="button"],[role="slider"]');
              assert.ok(await controls.count()>0,`Slide ${slide} needs controls`);
              const slider=frame.locator('[role="slider"]').first();
              if(await slider.count()){
                const before=await slider.getAttribute('aria-valuenow');
                const readout=frame.locator('[data-readout]').first();
                const text=await readout.textContent();
                const max=await slider.getAttribute('aria-valuemax');
                await slider.focus(); await slider.press(before===max?'ArrowLeft':'ArrowRight');
                await page.waitForTimeout(800);
                assert.notEqual(await slider.getAttribute('aria-valuenow'),before,`Slide ${slide} slider must change`);
                assert.notEqual(await readout.textContent(),text,`Slide ${slide} readout must change`);
              }
              const button=frame.locator('button:enabled:not([aria-pressed="true"])').first();
              if(await button.count()){
                const before=await frame.locator('[data-readout]').first().textContent();
                const pressed=await button.getAttribute('aria-pressed');
                await button.click(); await page.waitForTimeout(800);
                if(pressed!==null)assert.notEqual(await button.getAttribute('aria-pressed'),pressed);
                else assert.notEqual(await frame.locator('[data-readout]').first().textContent(),before);
              }
              await page.screenshot({path:`anatomy-evidence/slide-${slide}-desktop.png`,fullPage:true});
              await page.goto(`http://127.0.0.1:8765/workshop5.html?embed=1#${slide}`);
              assert.equal(await page.locator('.anatomy-figure iframe').count(),0);
              const img=page.locator('.anatomy-figure>img'); await img.waitFor();
              assert.ok(await img.evaluate(el=>el.complete&&el.naturalWidth>0));
              await page.screenshot({path:`anatomy-evidence/slide-${slide}-presenter.png`,fullPage:true});
            }
            await page.setViewportSize({width:390,height:844});
            await page.emulateMedia({reducedMotion:'reduce'});
            for(const slide of [8,10,30,35,39,43,44]){
              await page.goto(`http://127.0.0.1:8765/workshop5.html#${slide}`);
              const iframe=page.locator('.anatomy-figure iframe'); await iframe.waitFor();
              const frame=await iframe.elementHandle().then(el=>el.contentFrame());
              await frame.locator('svg').first().waitFor();
              assert.ok(await frame.evaluate(()=>matchMedia('(prefers-reduced-motion: reduce)').matches));
              assert.ok(await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)<=innerWidth+1));
              assert.ok(await frame.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)<=innerWidth+1));
              await page.waitForTimeout(1000);
              const still=await frame.evaluate(motionState); await page.waitForTimeout(2500);
              assert.deepEqual(await frame.evaluate(motionState),still,`Slide ${slide} reduced motion must remain still`);
              await page.screenshot({path:`anatomy-evidence/slide-${slide}-mobile-reduced.png`,fullPage:true});
            }
            const closeup=await browser.newPage({viewport:{width:1440,height:1100},deviceScaleFactor:4});
            closeup.on('pageerror',error=>errors.push(error.message));
            for(const id of ['bottleneck','loop','mcp','hooks','subagents','eval']){
              for(const theme of ['', '-light']){
                await closeup.goto(`http://127.0.0.1:8765/assets/anatomy/${id}${theme}.html`);
                const svg=closeup.locator('svg').first(); await svg.waitFor();
                await svg.screenshot({path:`anatomy-evidence/${id}${theme}-closeup.png`,scale:'device'});
                await closeup.evaluate(()=>{
                  const plate=document.querySelector('.iso-plate')||document.querySelector('svg');
                  document.body.style.minHeight='4000px';
                  const space=document.createElement('div'); space.style.height='4000px'; document.body.append(space);
                  scrollTo(0,plate.getBoundingClientRect().bottom+scrollY+innerHeight+240);
                });
                await closeup.waitForTimeout(1500);
                assert.ok(await svg.evaluate(el=>el.getBoundingClientRect().bottom<-120),`${id} must be offscreen`);
                const stopped=await closeup.evaluate(motionState); await closeup.waitForTimeout(2500);
                assert.deepEqual(await closeup.evaluate(motionState),stopped,`${id} offscreen motion must stop`);
              }
            }
            await closeup.close();
            assert.deepEqual(errors,[]);
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-acceptance
          path: anatomy-evidence/

name: Anatomy figure acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['assets/anatomy/**', 'tools/anatomy/**', 'app.js', 'styles.css', 'workshop*.html', 'workshop*-slides.js', 'index.html', 'presenter.html', 'presenter.js', 'sessions.js', 'tools/sessions.test.mjs', 'assets/workshop-*/**', '.github/workflows/anatomy-figures.yml']
permissions:
  contents: read
concurrency:
  group: anatomy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build standalone figures
        run: |
          node tools/anatomy/build.mjs --audit
          git diff --exit-code -- assets/anatomy
      - name: Test figure models
        run: |
          node --test --test-concurrency=2 tools/anatomy/bottleneck/model.test.mjs tools/anatomy/integration.test.mjs tools/anatomy/responsive.test.mjs tools/anatomy/runtime-init.test.mjs tools/sessions.test.mjs
      - name: Install remote browser checks
        id: browser-install
        run: |
          npm install --no-save --package-lock=false playwright@1.64.0
          npx --no-install playwright install --with-deps chromium
      - name: Check textures in both themes
        run: |
          mkdir -p anatomy-evidence
          export ANATOMY_CHROME_PATH="$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          export CHROME_PATH="$PWD/tools/anatomy/ci-chrome.sh"
          failures=0
          for id in bottleneck loop mcp hooks subagents eval; do
            for theme in '' '-light'; do
              node tools/anatomy/vendor/scripts/lines.mjs "assets/anatomy/$id$theme.html" --out "anatomy-evidence/$id$theme-lines.png" || failures=1
            done
          done
          test "$failures" = 0
      - name: Check classroom, presenter, mobile, controls and reduced motion
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/anatomy-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {mkdirSync} from 'node:fs';
          mkdirSync('anatomy-evidence',{recursive:true});
          const browser=await chromium.launch();
          const errors=[];
          const motionState=()=>({readouts:[...document.querySelectorAll('[data-readout]')].map(el=>el.textContent),parts:[...document.querySelectorAll('svg [transform],svg [style]')].map(el=>[el.getAttribute('transform'),el.getAttribute('style')])});
          const overflowState=()=>({width:innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),elements:[...document.querySelectorAll('body *')].map(el=>({tag:el.tagName,id:el.id,class:el.className,rect:el.getBoundingClientRect().toJSON()})).filter(item=>item.rect.width>0&&(item.rect.right>innerWidth+1||item.rect.left<-1))});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            page.on('pageerror',error=>errors.push(error.message));
            await page.context().addInitScript(()=>{
              window.__anatomyErrors=[];
              addEventListener('error',e=>window.__anatomyErrors.push(e.message));
              addEventListener('unhandledrejection',e=>window.__anatomyErrors.push(String(e.reason)));
            });
            for(const id of ['hooks','eval']){
              await page.mouse.move(1,1);
              await page.goto(`http://127.0.0.1:8765/assets/anatomy/${id}.html`);
              assert.ok(!await page.evaluate(()=>matchMedia('(prefers-reduced-motion: reduce)').matches));
              const slider=page.locator('[role="slider"]').first(); await slider.waitFor();
              const readout=page.locator('[data-readout]').first();
              const beforeValue=await slider.getAttribute('aria-valuenow');
              const beforeText=await readout.textContent();
              assert.deepEqual(await page.evaluate(()=>window.__anatomyErrors),[],`${id} must initialize without page errors`);
              try {
                await page.waitForFunction(({beforeValue,beforeText})=>{
                  const slider=document.querySelector('[role="slider"]'),readout=document.querySelector('[data-readout]');
                  return slider?.getAttribute('aria-valuenow')!==beforeValue&&readout?.textContent!==beforeText;
                },{beforeValue,beforeText},{timeout:10000});
              } catch {
                const afterValue=await slider.getAttribute('aria-valuenow'),afterText=await readout.textContent();
                assert.fail(`${id} idle tour did not change within 10s; slider ${beforeValue} -> ${afterValue}; readout ${beforeText} -> ${afterText}`);
              }
            }
            await page.goto('http://127.0.0.1:8765/workshop5.html#1');
            const sessions=await page.evaluate(()=>window.CLASSROOM_SESSIONS);
            for(const session of sessions){
              await page.locator('#session-select').selectOption(session.id);
              await page.waitForURL(`**/${session.href}`);
              assert.equal(await page.locator('#session-select').inputValue(),session.id);
              assert.ok(await page.locator('.heading h1').textContent());
              await page.waitForTimeout(1200);
              await page.screenshot({path:`anatomy-evidence/session-${session.id}-desktop.png`,fullPage:true});
              await page.setViewportSize({width:390,height:844});
              assert.ok(await page.locator('#session-select').isVisible());
              await page.screenshot({path:`anatomy-evidence/session-${session.id}-mobile.png`,fullPage:true});
              const overflow=await page.evaluate(()=>({width:innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),elements:[...document.querySelectorAll('body *')].map(el=>({tag:el.tagName,id:el.id,class:el.className,rect:el.getBoundingClientRect().toJSON()})).filter(item=>item.rect.width>0&&(item.rect.right>innerWidth+1||item.rect.left<-1))}));
              assert.ok(overflow.scrollWidth<=overflow.width+1,`${session.id} mobile overflow: ${JSON.stringify(overflow)}`);
              await page.setViewportSize({width:1440,height:1100});
              const presenter=await browser.newPage();
              const name=session.deck==='index.html'?'presenter.html':session.deck.replace('.html','-presenter.html');
              await presenter.goto(`http://127.0.0.1:8765/${name}?i=${session.start-1}`);
              const preview=presenter.locator('#p-frame');await preview.waitFor();
              await presenter.frameLocator('#p-frame').locator('.heading h1').waitFor();
              await presenter.waitForTimeout(1200);
              assert.ok((await preview.getAttribute('src')).startsWith(session.deck+'?embed=1'));
              await presenter.screenshot({path:`anatomy-evidence/session-${session.id}-presenter.png`,fullPage:true});
              await presenter.close();
            }
            for(const slide of [8,10,30,35,39,43,44]){
              await page.goto(`http://127.0.0.1:8765/workshop5.html#${slide}`);
              const iframe=page.locator('.anatomy-figure iframe');
              await iframe.waitFor(); assert.ok(await iframe.getAttribute('title'));
              const frame=await iframe.elementHandle().then(el=>el.contentFrame());
              await frame.locator('svg').first().waitFor();
              assert.deepEqual(await frame.evaluate(()=>window.__anatomyErrors),[]);
              const controls=frame.locator('button,input,select,[role="button"],[role="slider"]');
              assert.ok(await controls.count()>0,`Slide ${slide} needs controls`);
              const slider=frame.locator('[role="slider"]').first();
              if(await slider.count()){
                const before=await slider.getAttribute('aria-valuenow');
                const readout=frame.locator('[data-readout]').first();
                const text=await readout.textContent();
                const max=await slider.getAttribute('aria-valuemax');
                await slider.focus(); await slider.press(before===max?'ArrowLeft':'ArrowRight');
                await page.waitForTimeout(800);
                assert.notEqual(await slider.getAttribute('aria-valuenow'),before,`Slide ${slide} slider must change`);
                assert.notEqual(await readout.textContent(),text,`Slide ${slide} readout must change`);
              }
              const buttons=frame.locator('button:enabled:not([aria-pressed="true"])');
              const button=await buttons.count()?await buttons.first().elementHandle():null;
              if(button){
                const before=await frame.locator('[data-readout]').first().textContent();
                const pressed=await button.getAttribute('aria-pressed');
                await button.click(); await page.waitForTimeout(800);
                if(pressed!==null)assert.equal(await button.getAttribute('aria-pressed'),'true',`Slide ${slide} button must activate`);
                else assert.notEqual(await frame.locator('[data-readout]').first().textContent(),before);
              }
              await page.screenshot({path:`anatomy-evidence/slide-${slide}-desktop.png`,fullPage:true});
              await page.goto(`http://127.0.0.1:8765/workshop5.html?embed=1#${slide}`);
              assert.equal(await page.locator('.anatomy-figure iframe').count(),0);
              const img=page.locator('.anatomy-figure>img'); await img.waitFor();
              assert.ok(await img.evaluate(el=>el.complete&&el.naturalWidth>0));
              await page.screenshot({path:`anatomy-evidence/slide-${slide}-presenter.png`,fullPage:true});
            }
            await page.setViewportSize({width:390,height:844});
            await page.emulateMedia({reducedMotion:'reduce'});
            for(const slide of [8,10,30,35,39,43,44]){
              await page.goto(`http://127.0.0.1:8765/workshop5.html#${slide}`);
              const iframe=page.locator('.anatomy-figure iframe'); await iframe.waitFor();
              const frame=await iframe.elementHandle().then(el=>el.contentFrame());
              await frame.locator('svg').first().waitFor();
              assert.ok(await frame.evaluate(()=>matchMedia('(prefers-reduced-motion: reduce)').matches));
              await page.screenshot({path:`anatomy-evidence/slide-${slide}-mobile-reduced.png`,fullPage:true});
              const pageOverflow=await page.evaluate(overflowState),frameOverflow=await frame.evaluate(overflowState);
              assert.ok(pageOverflow.scrollWidth<=pageOverflow.width+1,`Slide ${slide} mobile page overflow: ${JSON.stringify(pageOverflow)}`);
              assert.ok(frameOverflow.scrollWidth<=frameOverflow.width+1,`Slide ${slide} mobile frame overflow: ${JSON.stringify(frameOverflow)}`);
              await page.waitForTimeout(1000);
              const still=await frame.evaluate(motionState); await page.waitForTimeout(2500);
              assert.deepEqual(await frame.evaluate(motionState),still,`Slide ${slide} reduced motion must remain still`);
            }
            const closeup=await browser.newPage({viewport:{width:1440,height:1100},deviceScaleFactor:4});
            closeup.on('pageerror',error=>errors.push(error.message));
            for(const id of ['bottleneck','loop','mcp','hooks','subagents','eval']){
              for(const theme of ['', '-light']){
                await closeup.goto(`http://127.0.0.1:8765/assets/anatomy/${id}${theme}.html`);
                const svg=closeup.locator('svg').first(); await svg.waitFor();
                await svg.screenshot({path:`anatomy-evidence/${id}${theme}-closeup.png`,scale:'device'});
                await closeup.evaluate(()=>{
                  const plate=document.querySelector('.iso-plate')||document.querySelector('svg');
                  document.body.style.minHeight='4000px';
                  const space=document.createElement('div'); space.style.height='4000px'; document.body.append(space);
                  scrollTo(0,plate.getBoundingClientRect().bottom+scrollY+innerHeight+240);
                });
                await closeup.waitForTimeout(1500);
                assert.ok(await svg.evaluate(el=>el.getBoundingClientRect().bottom<-120),`${id} must be offscreen`);
                const stopped=await closeup.evaluate(motionState); await closeup.waitForTimeout(2500);
                assert.deepEqual(await closeup.evaluate(motionState),stopped,`${id} offscreen motion must stop`);
              }
            }
            await closeup.close();
            assert.deepEqual(errors,[]);
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-acceptance
          path: anatomy-evidence/
